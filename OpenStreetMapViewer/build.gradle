description = 'OpenMap in the Play Store, the example app for using osmdroid'

apply plugin: 'com.android.application'
//apply from: "$rootDir/gradle/android-signing.gradle"


group = project.property("pom.groupId")
version = project.property("pom.version")

android {
    namespace = 'org.osmdroid'
    compileSdk = findProperty('android.compileSdkVersion').toInteger()


    defaultConfig {
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"


        applicationId = "org.osmdroid"

        minSdk = 23

        compileSdk = project.hasProperty('android.compileSdkVersion')
                ? Integer.parseInt(project.property('android.compileSdkVersion')) : 35

        // default targetSdkVersion to API 34+ for 16KB compatibility
        targetSdkVersion(project.hasProperty('android.targetSdkVersion')
                ? Integer.parseInt(project.property('android.targetSdkVersion')) : 34)

        // default versionCode o 1 if not provided
        versionCode = (project.hasProperty('android.versionCode')
                ? Integer.parseInt(project.property('android.versionCode')) : 1)

        versionName = project.version

        // 16KB page size compatibility settings
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    testOptions {
        unitTests.all {
            // All the usual Gradle options.
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
    packagingOptions {
        resources {
            pickFirsts += ['androidsupportmultidexversion.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
        // Fix for 16KB page size compatibility (required for Google Play Nov 2025+)
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // Additional configuration for 16KB page size compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Modern 16KB alignment for AGP 8.1+
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = false
        }
    }



    buildFeatures {
        buildConfig = true
    }
    lint {
        abortOnError = false
        disable += 'NonConstantResourceId'
    }



    //the following sets the required permissions for API 23+ devices and AVDs
    //
    // NOTE: applicationVariants was removed in AGP 9.x.
    // These permission-granting tasks use androidComponents.onVariants instead.
    // They register adb grant tasks for debug builds only.
}

// AGP 9.x replacement for applicationVariants.all: grant permissions for debug builds.
androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        def variantName = variant.name.capitalize()
        def appId = variant.applicationId.get()
        def installTaskName = "install${variantName}"
        def adbPath = sdkComponents.adb.get().asFile.absolutePath

        def grantLocationTask = tasks.register("configDevice${variantName}", Exec) {
            group = 'nameofyourtaskgroup'
            description = 'Grant ACCESS_FINE_LOCATION permission on device.'

            dependsOn installTaskName
            commandLine adbPath, "shell", "pm", "grant", "$appId", "android.permission.ACCESS_FINE_LOCATION"
        }

        def grantStorageTask = tasks.register("configDevice2${variantName}", Exec) {
            group = 'nameofyourtaskgroup'
            description = 'Grant WRITE_EXTERNAL_STORAGE permission on device.'

            dependsOn installTaskName
            commandLine adbPath, "shell", "pm", "grant", "$appId", "android.permission.WRITE_EXTERNAL_STORAGE"
        }

        def connectedTestTaskName = "connected${variantName}AndroidTest"
        tasks.configureEach { task ->
            if (task.name == connectedTestTaskName) {
                task.dependsOn grantLocationTask
                task.dependsOn grantStorageTask
            }
        }
    }
}

dependencies {
    //apparently google or gradle changed something so that
    //transitive dependencies of submodules in the same project
    //are not longer resolved...

    //osmdroid-mapsforge
//    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
//    implementation 'org.mapsforge:mapsforge-map:0.25.0'
//    implementation 'org.mapsforge:mapsforge-themes:0.25.0'


    // Explicitly pull the 0.30.0 variations via JitPack to override defaults
    implementation libs.mapsforge.map.android
    implementation libs.mapsforge.map
    implementation libs.mapsforge.themes

    // Exclude androidsvg JAR from mapsforge-map-android
//    implementation('org.mapsforge:mapsforge-map-android:0.21.0') {
//        exclude group: 'com.caverock', module: 'androidsvg'
//    }

    // Exclude androidsvg JAR from osmdroid-mapsforge (if it's a project dependency)
//    implementation(project(':osmdroid-mapsforge')) {
//        exclude group: 'com.caverock', module: 'androidsvg'
//    }


    implementation libs.androidx.legacy.support.v4
    implementation project(':osmdroid-android')
    implementation project(':osmdroid-geopackage')
    implementation project(':osmdroid-mapsforge')
    implementation project(':osmdroid-wms')
    implementation project(':osmdroid-shape')

    //mil-sym-android-renderer brings in a conflicting version of androidsvg
    implementation(libs.mil.sym.android.renderer) {
        exclude group: 'com.caverock', module: 'androidsvg-aar'
    }

    implementation libs.androidx.preference

    //used for various demos for picking offline tile archives
    implementation libs.filepicker

    //used for bookmark demo
    implementation libs.opencsv

    //usual android stuff
    implementation libs.material //needed for UI menuing
    implementation libs.androidx.cardview
    implementation libs.androidx.recyclerview

    implementation libs.androidx.appcompat


    //on device testing
    androidTestImplementation libs.androidx.annotation


    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    // Optional -- UI testing with Espresso
    androidTestImplementation libs.androidx.test.espresso.core
    // Optional -- UI testing with UI Automator
    androidTestImplementation libs.androidx.test.uiautomator
    // Optional -- UI testing with Compose
    androidTestImplementation libs.androidx.compose.ui.test.junit4


    implementation(libs.geopackage.android) {
        // It's good practice to repeat the excludes here if you repeated them
        // in the osmdroid-geopackage module, for consistency and to ensure
        // only what you need is included.
        exclude group: 'com.google.android.gms'
        exclude group: 'com.google.maps.android'
        exclude group: 'com.android.support', module: 'support-v13'

        // Exclude the problematic SQLite library for 16KB compatibility
        exclude group: 'io.requery', module: 'sqlite-android'
        exclude module: 'sqlite-android'

        // *** IMPORTANT: Make sure this exclude is REMOVED here too ***
        // exclude group: 'com.j256.ormlite'
    }

    // Use Android's built-in SQLite instead of the bundled version for 16KB compatibility
    implementation libs.androidx.sqlite
    implementation libs.androidx.sqlite.framework
}

configurations.configureEach {
    resolutionStrategy {
        force "androidx.annotation:annotation:${libs.versions.androidxAnnotation.get()}"
        force "androidx.lifecycle:lifecycle-livedata:${libs.versions.androidxLifecycle.get()}"
        force "androidx.lifecycle:lifecycle-runtime:${libs.versions.androidxLifecycle.get()}"
        force "androidx.lifecycle:lifecycle-viewmodel:${libs.versions.androidxLifecycle.get()}"

        // Force use of system SQLite for 16KB compatibility
        force "androidx.sqlite:sqlite:${libs.versions.androidxSqlite.get()}"
        force "androidx.sqlite:sqlite-framework:${libs.versions.androidxSqlite.get()}"
    }
}
