apply plugin: 'java'
apply plugin: 'distribution'
apply plugin: 'application'
apply plugin: 'maven-publish'
apply plugin: 'war'

group = project.property("pom.groupId")
version =  project.property("pom.version")
application {
    mainClass = "org.osmdroid.server.jdk.TileServer"
}

war {
    from('www') {

    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

distributions {
    main {
        contents {
            into('bin/www') {
                from 'www'
            }
            into('bin') {
                from "$projectDir.absolutePath/LICENSE-OpenLayers"
                from "$rootDir.absolutePath/LICENSE"
                from "$projectDir.absolutePath/README.md"
                from "$projectDir.absolutePath/sources.properties"
                from "$projectDir.absolutePath/usgstopo-grandcanyon.sqlite"
            }
        }
    }
}


description = "OpenStreetMaps Tile Server (JRE)"
configurations.configureEach {
    resolutionStrategy{
        force 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    }
}
dependencies {
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'org.apache.commons:commons-configuration2:2.15.1'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    // https://mvnrepository.com/artifact/org.apache.cxf/cxf-rt-rs-client
    implementation 'org.apache.cxf:cxf-rt-rs-client:4.2.2'
// https://mvnrepository.com/artifact/org.apache.cxf/cxf-rt-rs-service-description
    implementation 'org.apache.cxf:cxf-rt-rs-service-description:4.2.2'
// https://mvnrepository.com/artifact/org.apache.cxf/cxf-rt-rs-extension-providers
    implementation 'org.apache.cxf:cxf-rt-rs-extension-providers:4.2.2'
// https://mvnrepository.com/artifact/org.apache.cxf/cxf-rt-frontend-jaxws
    implementation 'org.apache.cxf:cxf-rt-frontend-jaxws:4.2.2'
// https://mvnrepository.com/artifact/org.apache.cxf/cxf-rt-transports-http
    implementation 'org.apache.cxf:cxf-rt-transports-http:4.2.2'
// https://mvnrepository.com/artifact/org.apache.cxf/cxf-rt-transports-http-jetty
    implementation 'org.apache.cxf:cxf-rt-transports-http-jetty:4.2.2'



    implementation 'org.springframework:spring-test:6.2.9'
    implementation 'org.springframework:spring-context:6.2.9'
    implementation 'commons-codec:commons-codec:1.19.0'

    //implementation group: 'org.apache.cxf', name: 'cxf-rt-rs-extension-providers', version:'4.0.4'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:4.0.0'
    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:3.1.11'
    implementation 'org.glassfish.jersey.core:jersey-client:3.1.11'
    implementation 'org.glassfish.jersey.media:jersey-media-moxy:3.1.11'
    implementation 'org.apache.cxf:cxf-rt-transports-http-jetty:4.1.3'
    implementation 'org.slf4j:slf4j-jdk14:2.0.17'
    implementation 'org.codehaus.jettison:jettison:1.5.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
}


afterEvaluate {
    publishing {

        publications {
            release(MavenPublication) {
                from components.web
                groupId = project.property("pom.groupId")
                artifactId = project.name
                version = project.property("pom.version")
                pom {
                    description =  project.description
                    url = project.property("pom.url")

                    //scm, organization and developers are injected via other mechanisms

                    licenses {
                        license {
                            name=project.property("pom.licenses.license.0.name");
                            url=project.property("pom.licenses.license.0.url");
                            distribution==project.property("pom.licenses.license.0.distribution");
                        }

                    }
                }
            }

            pdZipPublication(MavenPublication) {
                artifact "build/distributions/osmdroid-server-jdk-" + project.property("pom.version") + ".zip"

            }


        }
    }


}

afterEvaluate {
    tasks.matching { it.name == "publishPdZipPublicationPublicationToMavenLocal" }.all {
        dependsOn(tasks.named("distZip"))
    }
}


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
