# Versions Android Studio inspects and the Upgrade Assistant edits in place.
# Every module dependency is declared here; build.gradle files use the libs.* accessors.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
spotbugs = "6.5.12"
junit = "6.1.3"
robolectric = "4.17"
mapsforge = "0.30.0"

# androidx
androidxCore = "1.19.1"
androidxPreference = "1.2.1"
androidxAppcompat = "1.8.0"
androidxAnnotation = "1.11.0"
androidxLegacySupportV4 = "1.0.0"
androidxCardview = "1.0.0"
androidxRecyclerview = "1.4.0"
androidxSqlite = "2.7.1"
androidxLifecycle = "2.10.0"
androidxTest = "1.7.0"
androidxEspresso = "3.7.0"
androidxUiautomator = "2.4.0"
androidxComposeUi = "1.12.1"
material = "1.14.0"

# other Android libraries
geopackageAndroid = "6.7.5"
milSymAndroidRenderer = "0.2.5"
filepicker = "1.1.1"
opencsv = "5.12.0"
acra = "4.11.1"
jdbf = "2.2.4"

# JDK tools (OSMMapTilePackager, osmdroid-server-jdk)
httpmime = "4.5.14"
apacheMime4j = "0.8.15"
sqliteJdbc = "3.53.4.0"
jakartaServletApi = "6.1.0"
jakartaServletJspApi = "4.0.0"
jakartaWsRsApi = "3.1.0"
commonsConfiguration2 = "2.15.1"
commonsLang3 = "3.21.0"
commonsCollections4 = "4.6.0"
commonsCodec = "1.22.1"
cxf = "4.2.3"
spring = "7.0.9"
jersey = "4.0.3"
slf4j = "2.0.20"
jettison = "1.5.7"
jacksonDatabind = "2.22.3"

[libraries]
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mapsforge-map-android = { module = "com.github.mapsforge.mapsforge:mapsforge-map-android", version.ref = "mapsforge" }
mapsforge-map = { module = "com.github.mapsforge.mapsforge:mapsforge-map", version.ref = "mapsforge" }
mapsforge-themes = { module = "com.github.mapsforge.mapsforge:mapsforge-themes", version.ref = "mapsforge" }

# androidx
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidxPreference" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "androidxLegacySupportV4" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidxCardview" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidxSqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidxSqlite" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxUiautomator" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidxComposeUi" }
material = { module = "com.google.android.material:material", version.ref = "material" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }

# other Android libraries
geopackage-android = { module = "mil.nga.geopackage:geopackage-android", version.ref = "geopackageAndroid" }
mil-sym-android-renderer = { module = "io.github.missioncommand:mil-sym-android-renderer", version.ref = "milSymAndroidRenderer" }
filepicker = { module = "com.github.angads25:filepicker", version.ref = "filepicker" }
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
acra = { module = "ch.acra:acra", version.ref = "acra" }
jdbf = { module = "com.github.spyhunter99:jdbf", version.ref = "jdbf" }

# JDK tools (OSMMapTilePackager, osmdroid-server-jdk)
httpmime = { module = "org.apache.httpcomponents:httpmime", version.ref = "httpmime" }
apache-mime4j = { module = "org.apache.james:apache-mime4j", version.ref = "apacheMime4j" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakartaServletApi" }
jakarta-servlet-jsp-api = { module = "jakarta.servlet.jsp:jakarta.servlet.jsp-api", version.ref = "jakartaServletJspApi" }
commons-configuration2 = { module = "org.apache.commons:commons-configuration2", version.ref = "commonsConfiguration2" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
commons-collections4 = { module = "org.apache.commons:commons-collections4", version.ref = "commonsCollections4" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }
cxf-rt-rs-client = { module = "org.apache.cxf:cxf-rt-rs-client", version.ref = "cxf" }
cxf-rt-rs-service-description = { module = "org.apache.cxf:cxf-rt-rs-service-description", version.ref = "cxf" }
cxf-rt-rs-extension-providers = { module = "org.apache.cxf:cxf-rt-rs-extension-providers", version.ref = "cxf" }
cxf-rt-frontend-jaxws = { module = "org.apache.cxf:cxf-rt-frontend-jaxws", version.ref = "cxf" }
cxf-rt-transports-http = { module = "org.apache.cxf:cxf-rt-transports-http", version.ref = "cxf" }
cxf-rt-transports-http-jetty = { module = "org.apache.cxf:cxf-rt-transports-http-jetty", version.ref = "cxf" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
jersey-container-servlet = { module = "org.glassfish.jersey.containers:jersey-container-servlet", version.ref = "jersey" }
jersey-client = { module = "org.glassfish.jersey.core:jersey-client", version.ref = "jersey" }
jersey-media-moxy = { module = "org.glassfish.jersey.media:jersey-media-moxy", version.ref = "jersey" }
slf4j-jdk14 = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4j" }
jettison = { module = "org.codehaus.jettison:jettison", version.ref = "jettison" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jacksonDatabind" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
