// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Versions live in gradle/libs.versions.toml. Modules apply these by id.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    // spotbugs, so we can apply it in a quality pass if needed
    alias(libs.plugins.spotbugs) apply false
}

allprojects {

    // NOTE: project.group and project.version must be defined before including
    // maven-support.gradle since it uses these values...
    project.group = ( project.hasProperty('pom.groupId')
            ? project.property('pom.groupId') : "" )

    project.version =
            ( project.hasProperty('pom.version') ? project.property('pom.version') : "1.0" )

    // forces all changing dependencies (i.e. SNAPSHOTs) to automagicially download
    // (thanks, @BillBarnhill!)
    configurations.configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 0, 'seconds'
        }
    }


    tasks.withType(JavaCompile).tap {
        configureEach {
            options.encoding = "UTF-8"
            options.compilerArgs += ["-Xlint:unchecked"]
            // per-call deprecation warnings are hundreds of lines; opt in with -PlintDeprecation
            if (project.hasProperty('lintDeprecation')) {
                options.compilerArgs += ["-Xlint:deprecation"]
            }
        }
    }


}
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }
            }
        }
    }
}

// root build.gradle
gradle.afterProject { project ->
    project.afterEvaluate {
        tasks.matching { task ->
            task.name.startsWith("publish") &&
                    task.name.endsWith("PublicationToMavenLocal") &&
                    task.name.contains("PdZipPublication")
        }.configureEach { publishTask ->
            if (tasks.findByName("distZip")) {
                publishTask.dependsOn tasks.named("distZip")
            }
        }
    }
}

